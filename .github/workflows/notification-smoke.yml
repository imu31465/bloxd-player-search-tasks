name: Discord notification smoke test

on:
  push:
    branches:
      - main
    paths:
      - "NOTIFICATION_TEST.json"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.read.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Read one-shot notification test switch
        id: read
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          state = json.loads(Path("NOTIFICATION_TEST.json").read_text(encoding="utf-8"))
          enabled = state.get("enabled") if isinstance(state, dict) else None
          if not isinstance(enabled, bool):
              raise SystemExit("NOTIFICATION_TEST.json must contain boolean enabled")
          print("enabled=" + str(enabled).lower())
          PY

  send:
    needs: gate
    if: ${{ needs.gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send one Discord delivery test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DISCORD_WEBHOOK_URL:-}" ]]; then
            echo "::error::DISCORD_WEBHOOK_URL is missing."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          payload = {
              "content": "Bloxd Player Search: Discord通知の接続テストに成功しました。"
          }
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "bloxd-player-search/1.0",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Discord webhook returned HTTP {exc.code}") from exc
          if status not in (200, 204):
              raise SystemExit(f"Unexpected Discord webhook HTTP status: {status}")
          print(f"Discord webhook delivery accepted (HTTP {status}); URL withheld.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Discord webhook delivery accepted (HTTP {status}).\\n")
          PY
