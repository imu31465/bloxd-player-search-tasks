name: enrich

on:
  push:
    branches:
      - main
    paths:
      - "ENRICH_NOW.json"
  schedule:
    # Daily: probe 429 storms are per-runner-IP luck, so a failed or
    # degraded run should retry on a fresh runner the next day instead of
    # waiting two days (public runners are free).
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      force_ids:
        description: >-
          Comma-separated player ids to social-fetch right now, bypassing
          the A-gate skip rules - e.g. 3734 for a rename the cursor has not
          wrapped around to yet. When set, only these ids are processed
          (the regular 25k drip is skipped) and the stored cursor is not
          moved.
        required: false
        default: ""

concurrency:
  group: player-search-writers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cutover-gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.read.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Read fail-closed CUTOVER.json
        id: read
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          state = json.loads(Path("CUTOVER.json").read_text(encoding="utf-8"))
          enabled = state.get("enabled") if isinstance(state, dict) else None
          if not isinstance(enabled, bool):
              raise SystemExit("CUTOVER.json must contain a boolean enabled field")
          print("enabled=" + str(enabled).lower())
          PY
  prepare:
    needs: cutover-gate
    if: ${{ needs.cutover-gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve one private runner revision for all five workers
        id: source
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 --branch runner --filter=blob:none --sparse \
            git@github.com:imu31465/bloxd-player-search.git src
          SOURCE_SHA="$(git -C src rev-parse HEAD)"
          rm -f ~/.ssh/id_ed25519
          unset DEPLOY_KEY
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Pinned source runner SHA: $SOURCE_SHA"

  drip:
    needs: [cutover-gate, prepare]
    if: ${{ needs.cutover-gate.outputs.enabled == 'true' && (!inputs.force_ids || matrix.shard == 0) }}
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Clone task sources at the pinned runner revision
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 --branch runner --filter=blob:none --sparse \
            git@github.com:imu31465/bloxd-player-search.git src
          git -C src fetch --depth 1 origin "$SOURCE_SHA"
          git -C src checkout --detach "$SOURCE_SHA"
          rm -f ~/.ssh/id_ed25519
          unset DEPLOY_KEY
          git -C src sparse-checkout set --no-cone '/tools/' '/app.py' '/sharding.py' '/requirements.txt' '/cosmetics_codec.py' '/cosmetics_dictionary.json'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Resolve live SP token (bloxd.io redeploy rotation)
        # Each independent runner resolves and validates its own token. Values
        # are masked and never written to the job summary or public log.
        continue-on-error: true
        working-directory: src
        run: |
          SP=$(python tools/fetch_sp_token.py | head -n1 | tr -d '[:space:]') || SP=""
          if [ -z "$SP" ] || [ "${#SP}" -ne 60 ]; then
            echo "static path unusable; installing playwright for the browser fallback"
            pip install --quiet playwright
            SP=$(python tools/fetch_sp_token.py | head -n1 | tr -d '[:space:]') || SP=""
          fi
          if [ -n "$SP" ] && [ "${#SP}" -eq 60 ]; then
            echo "live SP token resolved (length ${#SP})"
            echo "::add-mask::$SP"
            echo "BLOXD_3PSIDMCSP=$SP" >> "$GITHUB_ENV"
          else
            echo "SP token resolution failed; app.py will derive live or use the committed fallback"
          fi

      - name: Drip refresh partition ${{ matrix.shard }}/5
        env:
          DATABASE_URL: ${{ secrets.SHARD_01_DATABASE_URL }}
          SHARD_DATABASE_URLS: ${{ secrets.SHARD_DATABASE_URLS }}
          SHARD_BUCKET_MAP: '["shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04"]'
          SHARD_PROJECT_IDS: '{"shard-01":"old-haze-17838481","shard-02":"twilight-violet-22165713","shard-03":"sparkling-star-88747543","shard-04":"super-meadow-54405222"}'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_IDS_INPUT: ${{ inputs.force_ids }}
          PYTHONDONTWRITEBYTECODE: "1"
        working-directory: src
        run: |
          # Five independent modulo partitions use isolated cursor keys and
          # runner IPs; this mirrors the already-proven 5-worker social sweep.
          ARGS=(--limit 10000 --probe-workers 1 --probe-retry-rounds 3 \
                --probe-retry-wait 120 --sleep 0.7 --fetch-cap 400 \
                --shard "${{ matrix.shard }}/5")
          if [ -n "$FORCE_IDS_INPUT" ]; then
            if [[ ! "$FORCE_IDS_INPUT" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
              echo "force_ids must be a comma-separated list of non-negative integers" >&2
              exit 2
            fi
            echo "forced ids: $FORCE_IDS_INPUT"
            ARGS+=(--force-ids "$FORCE_IDS_INPUT")
          fi
          python tools/run_masked.py tools/enrich_profiles.py "${ARGS[@]}"

      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ enrich shard ${{ matrix.shard }} failed",
                "color": 15158332,
                "fields": [
                  {"name": "リポジトリ", "value": "'"${GITHUB_REPOSITORY}"'", "inline": true},
                  {"name": "シャード", "value": "${{ matrix.shard }}/5", "inline": true},
                  {"name": "実行ログ", "value": "[run #'"${GITHUB_RUN_NUMBER}"']('"$RUN_URL"')", "inline": true}
                ],
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }' \
            > /dev/null
