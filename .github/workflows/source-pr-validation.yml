name: Private source PR validation (public runner)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-source-pr-validation
  cancel-in-progress: false

jobs:
  validate:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "PR #5 — main writer"
            source_ref: "feature/neon-free-sharding"
          - label: "PR #6 — runner writer"
            source_ref: "feature/runner-neon-free-sharding"

    steps:
      - name: Clone the selected private source branch
        id: source
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SOURCE_REF: ${{ matrix.source_ref }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_KEY:-}" ]]; then
            echo "::error::Repository secret DEPLOY_KEY is missing or empty."
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 --single-branch --branch "$SOURCE_REF" \
            git@github.com:imu31465/bloxd-player-search.git src

          SOURCE_SHA="$(git -C src rev-parse HEAD)"
          rm -f ~/.ssh/id_ed25519
          unset DEPLOY_KEY

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Validated source ref: $SOURCE_REF"
          echo "Validated source SHA: $SOURCE_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install application and test dependencies
        run: python -m pip install -r src/requirements.txt

      - name: Compile source, tools, and tests
        working-directory: src
        run: python -m compileall -q app.py sharding.py cosmetics_codec.py tools tests

      - name: Run the full unit and SQLite integration suite
        working-directory: src
        run: python -m unittest discover -s tests -v

  validate-altare:
    name: Altare reader and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone the private Altare PR branch
        shell: bash
        env:
          ALTARE_DEPLOY_KEY: ${{ secrets.ALTARE_VALIDATION_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ALTARE_DEPLOY_KEY:-}" ]]; then
            echo "::error::Repository secret ALTARE_VALIDATION_DEPLOY_KEY is missing or empty."
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$ALTARE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 --single-branch --branch feature/neon-free-sharding \
            git@github.com:imu31465/bloxd-player-search-altare.git altare

          ALTARE_SHA="$(git -C altare rev-parse HEAD)"
          rm -f ~/.ssh/id_ed25519
          unset ALTARE_DEPLOY_KEY
          echo "Validated Altare branch: feature/neon-free-sharding"
          echo "Validated Altare SHA: $ALTARE_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: altare/requirements.txt

      - name: Install Altare dependencies
        run: python -m pip install -r altare/requirements.txt

      - name: Compile Altare application, migration, and tests
        working-directory: altare
        run: python -m compileall -q app.py sharding.py scripts tests

      - name: Run Altare unit and SQLite integration suite
        working-directory: altare
        run: python -m unittest discover -s tests -v
