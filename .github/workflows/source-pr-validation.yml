name: Private source PR validation (public runner)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/source-pr-validation.yml"

permissions:
  contents: read

concurrency:
  group: private-source-pr-validation
  cancel-in-progress: false

jobs:
  validate:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Resolve the live PR branch heads on every run, rather than pinning
          # an earlier commit. The job logs the checked-out SHA for audit.
          - label: "PR #5 — main writer"
            source_ref: "feature/neon-free-sharding"
          - label: "PR #6 — runner writer"
            source_ref: "feature/runner-neon-free-sharding"

    steps:
      - name: Clone the selected private source branch
        id: source
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SOURCE_REF: ${{ matrix.source_ref }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_KEY:-}" ]]; then
            echo "::error::Repository secret DEPLOY_KEY is missing or empty."
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 --single-branch --branch "$SOURCE_REF" \
            git@github.com:imu31465/bloxd-player-search.git src

          SOURCE_SHA="$(git -C src rev-parse HEAD)"
          rm -f ~/.ssh/id_ed25519
          unset DEPLOY_KEY

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Validated source ref: $SOURCE_REF"
          echo "Validated source SHA: $SOURCE_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install application and test dependencies
        run: python -m pip install -r src/requirements.txt

      - name: Compile source, tools, and tests
        working-directory: src
        run: python -m compileall -q app.py sharding.py cosmetics_codec.py tools tests

      - name: Run the full unit and SQLite integration suite
        working-directory: src
        run: python -m unittest discover -s tests -v

  validate-altare:
    name: Altare reader and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      pg-source:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      pg-shard-01:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      pg-shard-02:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      pg-shard-03:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      pg-shard-04:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Clone the private Altare PR branch
        shell: bash
        env:
          ALTARE_DEPLOY_KEY: ${{ secrets.ALTARE_VALIDATION_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ALTARE_DEPLOY_KEY:-}" ]]; then
            echo "::error::Repository secret ALTARE_VALIDATION_DEPLOY_KEY is missing or empty."
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$ALTARE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 --single-branch --branch feature/neon-free-sharding \
            git@github.com:imu31465/bloxd-player-search-altare.git altare

          ALTARE_SHA="$(git -C altare rev-parse HEAD)"
          rm -f ~/.ssh/id_ed25519
          unset ALTARE_DEPLOY_KEY
          echo "Validated Altare branch: feature/neon-free-sharding"
          echo "Validated Altare SHA: $ALTARE_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: altare/requirements.txt

      - name: Install Altare dependencies
        run: python -m pip install -r altare/requirements.txt

      - name: Compile Altare application, migration, and tests
        working-directory: altare
        run: python -m compileall -q app.py sharding.py scripts tests

      - name: Run Altare unit, SQLite, and required PostgreSQL migration suites
        working-directory: altare
        env:
          ALTARE_PG_INTEGRATION: "1"
          ALTARE_TEST_SOURCE_DATABASE_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5433/postgres"
          ALTARE_TEST_SHARD_01_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5434/postgres"
          ALTARE_TEST_SHARD_02_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5435/postgres"
          ALTARE_TEST_SHARD_03_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5436/postgres"
          ALTARE_TEST_SHARD_04_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5437/postgres"
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee altare-tests.log
          if grep -q "skipped 'requires the disposable PostgreSQL services" altare-tests.log; then
            echo "::error::The PostgreSQL migration integration test was skipped."
            exit 1
          fi
          grep -q "test_dry_run_copy_resume_manifests_read_only_and_sequences" altare-tests.log

  validate-runner-secrets:
    name: Verify scheduled-runner secrets and Neon read access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate secret presence and JSON structure without printing values
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SHARD_01_DATABASE_URL: ${{ secrets.SHARD_01_DATABASE_URL }}
          SHARD_DATABASE_URLS: ${{ secrets.SHARD_DATABASE_URLS }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from urllib.parse import urlparse

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "")
          shard01 = os.environ.get("SHARD_01_DATABASE_URL", "")
          raw = os.environ.get("SHARD_DATABASE_URLS", "")
          if not webhook or not shard01 or not raw:
              raise SystemExit("One or more scheduled-runner secrets are missing.")

          parsed_webhook = urlparse(webhook)
          if parsed_webhook.scheme != "https" or parsed_webhook.hostname not in {"discord.com", "discordapp.com"} or not parsed_webhook.path.startswith("/api/webhooks/"):
              raise SystemExit("DISCORD_WEBHOOK_URL has an unexpected URL shape.")

          try:
              urls = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit("SHARD_DATABASE_URLS is not valid JSON.") from exc
          expected = {"shard-01", "shard-02", "shard-03", "shard-04"}
          if not isinstance(urls, dict) or set(urls) != expected:
              raise SystemExit("SHARD_DATABASE_URLS must contain exactly shard-01 through shard-04.")
          if urls["shard-01"] != shard01:
              raise SystemExit("SHARD_01_DATABASE_URL does not exactly match shard-01 in SHARD_DATABASE_URLS.")

          hosts = set()
          for key, value in urls.items():
              parsed = urlparse(value if not value.startswith("postgres://") else "postgresql://" + value[len("postgres://"):])
              if parsed.scheme not in {"postgresql", "postgresql+psycopg"} or not parsed.hostname or not parsed.username or not parsed.password:
                  raise SystemExit(f"{key} is not a complete PostgreSQL connection URL.")
              labels = parsed.hostname.lower().split(".", 1)
              labels[0] = labels[0].removesuffix("-pooler")
              host = ".".join(labels)
              if host in hosts:
                  raise SystemExit("Two shard URLs resolve to the same Neon endpoint host.")
              hosts.add(host)
          print("Scheduled-runner secret structure: valid (values withheld).")
          PY

      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.2,<4.0"

      - name: Verify each target connection with read-only SELECT
        shell: bash
        env:
          SHARD_DATABASE_URLS: ${{ secrets.SHARD_DATABASE_URLS }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import psycopg

          urls = json.loads(os.environ["SHARD_DATABASE_URLS"])
          for key in ("shard-01", "shard-02", "shard-03", "shard-04"):
              try:
                  url = urls[key]
                  if url.startswith("postgresql+psycopg://"):
                      url = "postgresql://" + url[len("postgresql+psycopg://"):]
                  elif url.startswith("postgres://"):
                      url = "postgresql://" + url[len("postgres://"):]
                  with psycopg.connect(url, connect_timeout=30) as conn:
                      row = conn.execute("""
                          SELECT current_user,
                                 has_schema_privilege(current_user, 'public', 'USAGE'),
                                 has_schema_privilege(current_user, 'public', 'CREATE')
                      """).fetchone()
                  if row[0] != "player_search_app" or not row[1] or not row[2]:
                      raise RuntimeError("unexpected role or public-schema privileges")
              except Exception as exc:
                  raise SystemExit(f"{key}: connection/grant check failed ({type(exc).__name__}).") from None
              print(f"{key}: SELECT and least-privilege app-role grants verified.")
          PY
