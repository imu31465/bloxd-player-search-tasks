name: Private source candidate validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit SHA to validate
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "SOURCE_VALIDATION_REQUEST.json"

permissions:
  contents: read

concurrency:
  group: private-source-candidate-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Exact source head — unit, SQLite, PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      pg-shard-01:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      pg-shard-02:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      pg-shard-03:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      pg-shard-04:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout task workflow repository
        uses: actions/checkout@v4

      - name: Clone and pin exact private source commit
        id: source
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SOURCE_SHA_INPUT: ${{ inputs.source_sha || '' }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$SOURCE_SHA_INPUT"
          if [[ -z "$SOURCE_SHA" && -f SOURCE_VALIDATION_REQUEST.json ]]; then
            SOURCE_SHA="$(python -c 'import json; print(json.load(open("SOURCE_VALIDATION_REQUEST.json", encoding="utf-8")).get("source_sha", ""))')"
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Provide a full 40-character SHA input or SOURCE_VALIDATION_REQUEST.json."
            exit 2
          fi
          if [[ -z "${DEPLOY_KEY:-}" ]]; then
            echo "::error::Repository secret DEPLOY_KEY is missing or empty."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git init src
          git -C src remote add origin git@github.com:imu31465/bloxd-player-search.git
          git -C src fetch --depth 1 origin "$SOURCE_SHA"
          git -C src checkout --detach FETCH_HEAD
          ACTUAL_SHA="$(git -C src rev-parse HEAD)"
          rm -f ~/.ssh/id_ed25519
          unset DEPLOY_KEY
          if [[ "$ACTUAL_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::Fetched source SHA did not match requested commit."
            exit 1
          fi
          echo "source_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "Validated exact source SHA: $ACTUAL_SHA"

      - name: Record exact source head
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          {
            echo "### Exact private source head"
            echo ""
            echo "$SOURCE_SHA"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and test dependencies
        run: python -m pip install -r src/requirements.txt

      - name: Compile source, tools, and tests
        working-directory: src
        run: python -m compileall -q app.py sharding.py cosmetics_codec.py tools tests

      - name: Run the full unit and SQLite integration suite
        working-directory: src
        run: python -m unittest discover -s tests -v

      - name: Verify source writer behavior against four disposable PostgreSQL shards
        working-directory: src
        run: python tests/verify_postgres_shard_writes.py
