name: enrich-continuation

on:
  workflow_run:
    workflows: ["enrich", "Enrich", "Enrich continuation"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enrich-continuation.yml"

concurrency:
  group: enrich-continuation-controller
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  continue:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.workflow_id == 426133266 && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact gate and worker logs by job ID
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/enrich-run-logs

          # workflow_run is the fast path. A five-minute poll is the durable
          # fallback for GitHub occasionally omitting workflow_run deliveries.
          if [[ -z "${RUN_ID}" ]]; then
            # A GITHUB_TOKEN-dispatched controller may start just before the
            # parent enrich workflow reaches its final completed state. Wait
            # briefly so the completion is visible to the Actions API query.
            if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
              sleep 20
            fi
            python3 - <<'PY' > /tmp/enrich-run-logs/selected-run.txt
          import json
          import os
          import urllib.request
          from pathlib import Path
          progress = json.loads(Path("ENRICH_PROGRESS.json").read_text(encoding="utf-8"))
          last_run_id = int(progress.get("last_run_id") or 0)
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/runs?per_page=100"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              data = json.load(response)
          pending = sorted(
              (run for run in data.get("workflow_runs", [])
               if int(run.get("workflow_id", 0)) == 426133266
               and int(run.get("id", 0)) > last_run_id),
              key=lambda run: (run.get("run_number", 0), run.get("id", 0)),
          )
          if not pending or pending[0].get("status") != "completed":
              raise SystemExit(0)
          run = pending[0]
          print(f"{run['id']} {run.get('event', '')} {run.get('conclusion', '')}")
          PY
            if [[ ! -s /tmp/enrich-run-logs/selected-run.txt ]]; then
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              echo "No completed unprocessed enrich run."
              exit 0
            fi
            read -r RUN_ID RUN_EVENT RUN_CONCLUSION < /tmp/enrich-run-logs/selected-run.txt
          fi
          export RUN_ID RUN_EVENT RUN_CONCLUSION
          last_processed="$(python3 -c 'import json; print(json.load(open("ENRICH_PROGRESS.json", encoding="utf-8")).get("last_run_id") or 0)')"
          if [[ "${RUN_ID}" -le "${last_processed}" ]]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "Enrich run ${RUN_ID} was already recorded; skipping duplicate event."
            exit 0
          fi
          echo "Processing enrich run ${RUN_ID} (event: ${RUN_EVENT}, conclusion: ${RUN_CONCLUSION})"
          if [[ "${RUN_CONCLUSION}" != "success" ]]; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("ENRICH_PROGRESS.json")
          progress = json.loads(path.read_text(encoding="utf-8"))
          run_id = int(os.environ["RUN_ID"])
          failures = int(progress.get("consecutive_workflow_failures", 0)) + 1
          progress["last_run_id"] = run_id
          progress["last_seen_at"] = datetime.now(timezone.utc).isoformat()
          progress["consecutive_workflow_failures"] = failures
          progress["last_failed_run"] = {
              "run_id": run_id,
              "event": os.environ.get("RUN_EVENT", ""),
              "conclusion": os.environ.get("RUN_CONCLUSION", ""),
              "consecutive_failures": failures,
          }
          if failures > 3:
              progress["status"] = "paused"
              progress["last_pause_reason"] = "consecutive-enrich-workflow-failures"
              dispatch = False
          else:
              # Completed jobs may already have committed part of their work.
              # Their DB cursors are authoritative; a fresh bounded run resumes
              # each worker independently and safely retries any uncommitted IDs.
              progress["status"] = "running"
              progress["last_pause_reason"] = None
              dispatch = True
          path.write_text(json.dumps(progress, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("dispatch=" + str(dispatch).lower())
          print("reason=" + progress["status"])
          print("run_id=" + str(run_id))
          PY
            exit 0
          fi
          echo "Processing enrich run ${RUN_ID} (event: ${RUN_EVENT})"
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" -o /tmp/enrich-run-logs/jobs.json

          python3 - <<'PY' > /tmp/enrich-run-logs/jobs.txt
          import json
          import re
          from pathlib import Path
          data = json.loads(Path("/tmp/enrich-run-logs/jobs.json").read_text(encoding="utf-8"))
          jobs = data.get("jobs", [])
          gates = [job for job in jobs if job.get("name") == "cutover-gate"]
          workers = {}
          for job in jobs:
              match = re.fullmatch(r"drip \(([0-4])\)", job.get("name", ""))
              if match:
                  workers[int(match.group(1))] = job["id"]
          if len(gates) != 1 or set(workers) != set(range(5)):
              raise SystemExit("workflow run is missing the expected gate or five worker jobs")
          print("gate.txt " + str(gates[0]["id"]))
          for shard in range(5):
              print(f"drip-{shard}.txt {workers[shard]}")
          PY

          while read -r filename job_id; do
            archive="/tmp/enrich-run-logs/${filename%.txt}.zip"
            valid_archive=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${job_id}/logs" -o "${archive}" \
                && python3 -c 'import re, sys, zipfile; p=sys.argv[1]; data=open(p,"rb").read(); text=data.decode("utf-8-sig","replace"); ok=zipfile.is_zipfile(p) or any(re.match(r"^\d{4}-\d{2}-\d{2}T", line) for line in text.splitlines()[:20]); sys.exit(0 if ok else 1)' "${archive}"; then
                valid_archive=true
                break
              fi
              echo "Log archive for job ${job_id} is not ready (attempt ${attempt}/12); retrying in 5s." >&2
              sleep 5
            done
            if [[ "${valid_archive}" != true ]]; then
              echo "Unable to retrieve a valid ZIP log archive for job ${job_id}." >&2
              head -c 1000 "${archive}" >&2 || true
              exit 1
            fi
            python3 - "${archive}" "/tmp/enrich-run-logs/${filename}" <<'PY'
          import sys
          import zipfile
          from pathlib import Path
          archive, output = sys.argv[1:3]
          if zipfile.is_zipfile(archive):
              with zipfile.ZipFile(archive) as zf:
                  members = [name for name in zf.namelist() if name.endswith(".txt")]
                  if not members:
                      raise SystemExit(f"job log archive has no .txt members: {archive}")
                  content = chr(10).join(
                      zf.read(name).decode("utf-8", errors="replace")
                      for name in members
                  )
          else:
              # GitHub may serve a single-job log as plain text instead of ZIP.
              content = Path(archive).read_text(encoding="utf-8-sig", errors="replace")
              if not content.strip():
                  raise SystemExit(f"job log response is empty: {archive}")
          Path(output).write_text(content, encoding="utf-8")
          PY
          done < /tmp/enrich-run-logs/jobs.txt

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("/tmp/enrich-run-logs")
          progress_path = Path("ENRICH_PROGRESS.json")
          progress = json.loads(progress_path.read_text(encoding="utf-8"))
          run_id = int(os.environ["RUN_ID"])
          run_event = os.environ["RUN_EVENT"]

          all_log_text = "\n".join(
              path.read_text(encoding="utf-8", errors="replace")
              for path in root.glob("*.txt")
          )
          # Manual force_ids runs are intentionally one-off and must not
          # start an unattended full-corpus continuation chain.
          progress.pop("consecutive_workflow_failures", None)
          progress.pop("last_failed_run", None)

          if run_event == "workflow_dispatch" and "ENRICH_CONTINUATION=true" not in all_log_text:
              # Mark one-off/manual force-ID runs as observed but never let
              # them advance the unattended full-corpus cursor chain.
              progress["last_run_id"] = run_id
              progress["last_seen_at"] = datetime.now(timezone.utc).isoformat()
              progress["last_ignored_run_reason"] = "manual-dispatch-not-auto-continuation"
              progress_path.write_text(
                  json.dumps(progress, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
              print("dispatch=false")
              print("reason=manual-dispatch-not-auto-continuation")
              raise SystemExit(0)

          if progress.get("status") == "completed":
              print("dispatch=false")
              print("reason=full-pass-already-complete")
              raise SystemExit(0)

          completed = set(progress.get("completed_shards", []))
          active = sorted(set(range(5)) - completed)
          worker_state = {}
          pause_reason = None

          for shard in active:
              log_path = root / f"drip-{shard}.txt"
              if not log_path.is_file():
                  pause_reason = f"missing-worker-log-{shard}"
                  break
              content = log_path.read_text(encoding="utf-8", errors="replace")
              summaries = [
                  line for line in content.splitlines()
                  if "bloxd enrich:" in line
                  and f"[mode=cursor shard={shard}/5]" in line
              ]
              if len(summaries) != 1:
                  pause_reason = f"missing-or-ambiguous-summary-{shard}"
                  break
              line = summaries[0]
              cursor = re.search(r"cursor\s+(\d+)->(\d+)", line)
              errors = re.search(r"\berr\s+(\d+)", line)
              probe429 = re.search(r"\bprobe429\s+(\d+)", line)
              pending = re.search(r"\bpending\s+(\d+)", line)
              aborted = re.search(r"ABORTED \((.*?)\)", line)
              if cursor is None or errors is None:
                  pause_reason = f"unparseable-summary-{shard}"
                  break
              start, end = (int(cursor.group(1)), int(cursor.group(2)))
              err_count = int(errors.group(1))
              probe429_count = int(probe429.group(1)) if probe429 else 0
              pending_count = int(pending.group(1)) if pending else 0
              abort_reason = aborted.group(1) if aborted else None

              worker_state[str(shard)] = {
                  "cursor_start": start,
                  "cursor_end": end,
                  "err": err_count,
                  "probe429": probe429_count,
                  "pending": pending_count,
                  "abort_reason": abort_reason,
                  "summary": line.strip()[-1200:],
              }

              # Keep retry state per worker. A single transient profile-fetch
              # failure must not strand the other four workers or stop the
              # full pass: cursor_end is the earliest unresolved ID and the
              # next bounded run resumes there. Stop only when the same
              # unresolved cursor fails repeatedly.
              cycle = progress.setdefault("worker_cycles", {}).setdefault(
                  str(shard),
                  {"start_cursor": 242336, "wrapped": False, "completed": False},
              )
              # Probe 429s already received three in-script cooldown rounds.
              # Retry the retained earliest cursor across bounded runs, and
              # pause only after four consecutive runs fail at that same ID.
              if probe429_count:
                  if int(cycle.get("probe_retry_cursor", -1)) == end:
                      probe_retry_count = int(cycle.get("probe_retry_count", 0)) + 1
                  else:
                      probe_retry_count = 1
                  cycle["probe_retry_cursor"] = end
                  cycle["probe_retry_count"] = probe_retry_count
                  if probe_retry_count > 3:
                      pause_reason = f"worker-{shard}-same-probe-cursor-429-{probe_retry_count}-runs"
                      break
              else:
                  cycle.pop("probe_retry_cursor", None)
                  cycle.pop("probe_retry_count", None)

              if err_count:
                  if int(cycle.get("retry_cursor", -1)) == end:
                      retry_count = int(cycle.get("retry_count", 0)) + 1
                  else:
                      retry_count = 1
                  cycle["retry_cursor"] = end
                  cycle["retry_count"] = retry_count
                  if retry_count > 3:
                      pause_reason = f"worker-{shard}-same-cursor-failed-{retry_count}-runs"
                      break
              else:
                  cycle.pop("retry_cursor", None)
                  cycle.pop("retry_count", None)

              worker_state[str(shard)]["retry_count"] = int(cycle.get("retry_count", 0))
              probe_storm_abort = bool(
                  probe429_count and abort_reason
                  and abort_reason.startswith("probe 429 storm")
              )
              if (abort_reason and abort_reason != "fetch cap 400 reached"
                      and not probe_storm_abort):
                  pause_reason = f"worker-{shard}-aborted-{abort_reason}"
                  break
              if pending_count and abort_reason != "fetch cap 400 reached":
                  retryable_fetch_error = bool(
                      err_count and abort_reason is None
                      and int(cycle.get("retry_count", 0)) <= 3
                  )
                  retryable_probe429 = bool(
                      probe429_count and probe_retry_count <= 3
                      and (abort_reason is None or probe_storm_abort)
                  )
                  cooldown_deferred = bool(
                      not err_count and not probe429_count
                      and start == end and abort_reason is None
                  )
                  if cooldown_deferred:
                      worker_state[str(shard)]["retry_deferred"] = True
                  elif not (retryable_fetch_error or retryable_probe429):
                      pause_reason = f"worker-{shard}-has-pending-without-safe-retry"
                      break

              # A first wrap only proves that IDs above the legacy
              # high-watermark were exhausted. Continue from ID 1 until the
              # cursor returns to the original 242336 boundary; this also
              # covers the small set of unresolved rows below that old cursor.
              cycle_start = int(cycle.get("start_cursor", 242336))
              if end < cycle_start:
                  cycle["wrapped"] = True
              if (cycle.get("wrapped") and end >= cycle_start
                      and err_count == 0 and probe429_count == 0
                      and pending_count == 0):
                  completed.add(shard)
                  cycle["completed"] = True
              progress["worker_cycles"][str(shard)] = cycle

          progress["total_runs_observed"] = int(progress.get("total_runs_observed", 0)) + 1
          progress["last_run_id"] = run_id
          progress["last_seen_at"] = datetime.now(timezone.utc).isoformat()
          progress["latest_workers"] = worker_state
          progress["completed_shards"] = sorted(completed)

          if pause_reason:
              progress["status"] = "paused"
              progress["last_pause_reason"] = pause_reason
              dispatch = False
          elif len(completed) == 5:
              progress["status"] = "completed"
              progress["completed_at"] = datetime.now(timezone.utc).isoformat()
              progress["last_pause_reason"] = None
              dispatch = False
          else:
              progress["status"] = "running"
              progress["last_pause_reason"] = None
              dispatch = True

          progress_path.write_text(json.dumps(progress, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("dispatch=" + str(dispatch).lower())
          print("completed_shards=" + ",".join(str(x) for x in sorted(completed)))
          print("reason=" + (pause_reason or progress["status"]))
          print("run_id=" + str(run_id))
          PY

      - name: Commit progress state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ENRICH_PROGRESS.json
          if ! git diff --cached --quiet; then
            git commit -m "Update full-pass enrichment progress"
            # Other independent task-repo commits (for example, validation
            # workflow maintenance) can land while this run is parsing logs.
            # Rebase the progress-only commit instead of abandoning the run
            # when its first non-fast-forward push races with main.
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "progress push raced with another main update (attempt $attempt/5); retrying"
              sleep "$attempt"
            done
            if [[ "$pushed" != true ]]; then
              echo "::error::Could not publish enrichment progress after five rebased push attempts."
              exit 1
            fi
          fi

      - name: Dispatch the next bounded pass
        if: ${{ steps.plan.outputs.dispatch == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --method POST "repos/${REPOSITORY}/actions/workflows/enrich.yml/dispatches" -f ref=main -f inputs[continue_chain]=true
