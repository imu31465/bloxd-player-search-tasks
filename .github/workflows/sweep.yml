name: sweep

on:
  schedule:
    # Every 30 minutes; each run drives five parallel shards (each on its own
    # runner IP) for ~25 minutes, so the fleet runs near-continuously.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Soft time budget per shard in minutes (default 25)"
        required: false
        default: "25"

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ vars.PLAYER_SEARCH_SHARD_CUTOVER == 'ready' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve one source revision for every sweep shard
        id: source
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 --branch runner --filter=blob:none --sparse \
            git@github.com:imu31465/bloxd-player-search.git src
          echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  shard:
    needs: prepare
    if: ${{ vars.PLAYER_SEARCH_SHARD_CUTOVER == 'ready' }}
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    concurrency:
      # One run per shard at a time; shards are independent id classes.
      group: sweep-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - name: Clone task sources (read-only deploy key)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 --branch runner --filter=blob:none --sparse \
            git@github.com:imu31465/bloxd-player-search.git src
          git -C src fetch --depth 1 origin "$SOURCE_SHA"
          git -C src checkout --detach "$SOURCE_SHA"
          git -C src sparse-checkout set --no-cone '/tools/' '/app.py' '/sharding.py' '/requirements.txt' '/cosmetics_codec.py' '/cosmetics_dictionary.json'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Resolve live SP token (bloxd.io redeploy rotation)
        # The anti-bot 3PSIDMCSP token rotates on bloxd.io client redeploys
        # (2026-11-14 and again on 2026-11-15). fetch_sp_token.py re-derives
        # it statically from the live JS bundle (minifier-proof anchors, no
        # browser) and validates the candidate by actually minting; the
        # Playwright capture only runs when that fails. app.py also derives
        # on its own at import, so a total failure here is survivable.
        # Defensive parsing: even if something ever leaks a second line to
        # stdout, only the first clean line can enter $SP (runs 100-102
        # died to a polluted capture writing a multi-line GITHUB_ENV).
        continue-on-error: true
        working-directory: src
        run: |
          SP=$(python tools/fetch_sp_token.py | head -n1 | tr -d '[:space:]') || SP=""
          if [ -z "$SP" ] || [ "${#SP}" -ne 60 ]; then
            echo "static path unusable; installing playwright for the browser fallback"
            pip install --quiet playwright
            SP=$(python tools/fetch_sp_token.py | head -n1 | tr -d '[:space:]') || SP=""
          fi
          if [ -n "$SP" ] && [ "${#SP}" -eq 60 ]; then
            echo "live SP token resolved (length ${#SP})"
            echo "::add-mask::$SP"
            echo "BLOXD_3PSIDMCSP=$SP" >> "$GITHUB_ENV"
          else
            echo "SP token resolution failed; app.py will derive live or use the committed fallback"
          fi

      - name: Run shard
        env:
          DATABASE_URL: ${{ secrets.SHARD_01_DATABASE_URL }}
          SHARD_DATABASE_URLS: ${{ secrets.SHARD_DATABASE_URLS }}
          SHARD_BUCKET_MAP: '["shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-01","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-02","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-03","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04","shard-04"]'
          SHARD_PROJECT_IDS: '{"shard-01":"old-haze-17838481","shard-02":"twilight-violet-22165713","shard-03":"sparkling-star-88747543","shard-04":"super-meadow-54405222"}'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SWEEP_MINUTES_INPUT: ${{ inputs.minutes }}
          PYTHONDONTWRITEBYTECODE: "1"
        working-directory: src
        run: |
          MINS="${SWEEP_MINUTES_INPUT:-25}"
          if [[ ! "$MINS" =~ ^[0-9]+$ ]] || (( MINS < 1 || MINS > 30 )); then
            echo "minutes must be an integer from 1 to 30" >&2
            exit 2
          fi
          python tools/run_masked.py tools/social_sweep.py \
            --shard ${{ matrix.shard }}/5 --minutes "$MINS"

      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ sweep shard '"${{ matrix.shard }}"' failed",
                "color": 15158332,
                "fields": [
                  {"name": "リポジトリ", "value": "'"${GITHUB_REPOSITORY}"'", "inline": true},
                  {"name": "シャード", "value": "'"${{ matrix.shard }}"'/5", "inline": true},
                  {"name": "実行ログ", "value": "[run #'"${GITHUB_RUN_NUMBER}"']('"$RUN_URL"')", "inline": true}
                ],
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }' \
            > /dev/null
